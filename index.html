<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dominican City — República Dominicana 1950-2000</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #071018;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

#game {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.2)),
        #182a1d;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

/* HUD */

#hud {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 20;

    width: 300px;
    padding: 14px;

    background: rgba(12, 18, 24, .88);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;

    box-shadow: 0 10px 35px rgba(0,0,0,.35);
    backdrop-filter: blur(8px);
}

#hud h1 {
    font-size: 18px;
    margin-bottom: 8px;
    color: #ffd166;
}

.stat {
    margin: 7px 0;
}

.stat-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 3px;
}

.bar {
    height: 7px;
    border-radius: 10px;
    overflow: hidden;
    background: #222;
}

.bar-fill {
    height: 100%;
    transition: width .25s;
}

.health { background: #e63946; }
.energy { background: #06d6a0; }
.hunger { background: #f4a261; }

#money {
    color: #ffd166;
    font-weight: bold;
}

#year {
    color: #8ecae6;
}

/* INFO */

#info {
    position: fixed;
    right: 16px;
    top: 16px;
    z-index: 20;

    width: 270px;
    padding: 14px;

    background: rgba(12,18,24,.88);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;

    backdrop-filter: blur(8px);
}

#info h2 {
    font-size: 15px;
    color: #90be6d;
    margin-bottom: 7px;
}

/* Controls */

#controls {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 20;

    padding: 12px 15px;

    background: rgba(12,18,24,.88);
    border-radius: 12px;

    font-size: 12px;
    line-height: 1.8;

    border: 1px solid rgba(255,255,255,.12);
}

.key {
    display: inline-block;
    min-width: 23px;
    text-align: center;

    padding: 2px 5px;

    border-radius: 4px;
    background: #263238;
    color: #fff;

    font-weight: bold;
}

/* Notifications */

#notification {
    position: fixed;
    left: 50%;
    bottom: 90px;

    transform: translateX(-50%);

    z-index: 100;

    padding: 12px 20px;

    background: rgba(0,0,0,.9);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px;

    opacity: 0;
    pointer-events: none;

    transition: opacity .25s;

    font-size: 14px;
}

#notification.show {
    opacity: 1;
}

/* Interaction */

#interaction {
    position: fixed;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 50;

    min-width: 320px;
    max-width: 500px;

    padding: 24px;

    background: rgba(10,16,21,.96);

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 16px;

    box-shadow: 0 25px 70px rgba(0,0,0,.55);

    display: none;
}

#interaction.active {
    display: block;
}

#interaction h2 {
    color: #ffd166;
    margin-bottom: 10px;
}

#interaction p {
    color: #ccd6dd;
    line-height: 1.5;
}

button {
    margin-top: 15px;

    border: none;
    border-radius: 8px;

    padding: 10px 15px;

    background: #e9c46a;
    color: #101010;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #ffd166;
}

/* Era */

#era {
    position: fixed;
    top: 16px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    padding: 8px 15px;

    border-radius: 20px;

    background: rgba(0,0,0,.7);
    color: #fff;

    font-size: 12px;
}

/* Mobile */

@media(max-width: 700px) {

    #hud {
        width: 220px;
        transform: scale(.85);
        transform-origin: top left;
    }

    #info {
        display: none;
    }

    #controls {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="era">
    República Dominicana · <span id="year">1965</span>
</div>

<div id="hud">

    <h1>🇩🇴 Dominican City</h1>

    <div class="stat">
        <div class="stat-label">
            <span>Salud</span>
            <span id="healthText">100</span>
        </div>

        <div class="bar">
            <div id="healthBar" class="bar-fill health" style="width:100%"></div>
        </div>
    </div>

    <div class="stat">
        <div class="stat-label">
            <span>Energía</span>
            <span id="energyText">100</span>
        </div>

        <div class="bar">
            <div id="energyBar" class="bar-fill energy" style="width:100%"></div>
        </div>
    </div>

    <div class="stat">
        <div class="stat-label">
            <span>Hambre</span>
            <span id="hungerText">100</span>
        </div>

        <div class="bar">
            <div id="hungerBar" class="bar-fill hunger" style="width:100%"></div>
        </div>
    </div>

    <div style="margin-top:10px;">
        Dinero:
        <span id="money">$25</span>
    </div>

    <div style="margin-top:5px;">
        Trabajo:
        <span id="job">Desempleado</span>
    </div>

</div>

<div id="info">

    <h2>Ciudad</h2>

    <p id="location">
        Barrio Dominicano
    </p>

    <br>

    <h2>Actividad</h2>

    <p id="activity">
        Caminando por el barrio.
    </p>

</div>

<div id="controls">

    <span class="key">W</span>
    <span class="key">A</span>
    <span class="key">S</span>
    <span class="key">D</span>
    mover

    <br>

    <span class="key">E</span>
    interactuar

    <br>

    <span class="key">B</span>
    bailar

    <br>

    <span class="key">F</span>
    trabajar

</div>

<div id="notification"></div>

<div id="interaction">

    <h2 id="interactionTitle">
        Dominican City
    </h2>

    <p id="interactionText">
        ...
    </p>

    <button onclick="closeInteraction()">
        Cerrar
    </button>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const GAME_WIDTH = 1600;
const GAME_HEIGHT = 1000;

const canvas = document.createElement("canvas");

canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

document.getElementById("game").appendChild(canvas);

const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

const game = {

    year: 1965,

    time: 8,

    player: {

        x: 800,
        y: 520,

        speed: 3,

        health: 100,
        energy: 100,
        hunger: 100,

        money: 25,

        job: "Desempleado",

        dancing: false
    },

    camera: {

        x: 0,
        y: 0
    },

    keys: {},

    npcs: [],

    vehicles: [],

    buildings: [],

    particles: [],

    location: "Barrio Dominicano"

};


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener("keydown", e => {

    game.keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "e") {

        interact();
    }

    if (e.key.toLowerCase() === "b") {

        toggleDance();
    }

    if (e.key.toLowerCase() === "f") {

        work();
    }
});


window.addEventListener("keyup", e => {

    game.keys[e.key.toLowerCase()] = false;

});


/* =========================================================
   MAPA
========================================================= */

function createBuildings() {

    game.buildings = [

        {
            x: 100,
            y: 100,
            w: 220,
            h: 140,
            name: "Colmado Don Pepe",
            color: "#d9a441"
        },

        {
            x: 420,
            y: 90,
            w: 260,
            h: 160,
            name: "Barbería",
            color: "#8d5524"
        },

        {
            x: 850,
            y: 90,
            w: 300,
            h: 160,
            name: "Supermercado",
            color: "#457b9d"
        },

        {
            x: 1200,
            y: 110,
            w: 260,
            h: 170,
            name: "Escuela",
            color: "#e76f51"
        },

        {
            x: 100,
            y: 700,
            w: 280,
            h: 160,
            name: "Casa Familiar",
            color: "#6a994e"
        },

        {
            x: 500,
            y: 720,
            w: 280,
            h: 150,
            name: "Club Social",
            color: "#9b5de5"
        },

        {
            x: 1000,
            y: 700,
            w: 320,
            h: 170,
            name: "Parque",
            color: "#386641"
        }
    ];

}


/* =========================================================
   NPC
========================================================= */

function createNPC(x, y, name, role, color) {

    return {

        x,
        y,

        name,
        role,

        color,

        speed: .5,

        direction: Math.random() * Math.PI * 2,

        talking: false
    };

}


function createNPCs() {

    game.npcs.push(
        createNPC(700, 500, "Don Ramón", "Barbero", "#c49a6c"),
        createNPC(900, 500, "José", "Taxista", "#e63946"),
        createNPC(600, 400, "María", "Maestra", "#f4a261"),
        createNPC(1100, 500, "Pedro", "Músico", "#457b9d"),
        createNPC(500, 600, "Ana", "Estudiante", "#6a994e"),
        createNPC(1000, 600, "Juan", "Trabajador", "#8d5524")
    );

}


/* =========================================================
   VEHÍCULOS
========================================================= */

function createVehicles() {

    game.vehicles.push({

        x: 300,

        y: 500,

        type: "concho",

        color: "#f1c40f",

        speed: 1.2
    });

    game.vehicles.push({

        x: 1200,

        y: 550,

        type: "carro público",

        color: "#ffffff",

        speed: 1
    });

}


/* =========================================================
   MOVIMIENTO
========================================================= */

function updatePlayer() {

    const p = game.player;

    let dx = 0;
    let dy = 0;

    if (game.keys["w"]) dy -= 1;
    if (game.keys["s"]) dy += 1;
    if (game.keys["a"]) dx -= 1;
    if (game.keys["d"]) dx += 1;

    if (dx !== 0 || dy !== 0) {

        const length = Math.sqrt(dx * dx + dy * dy);

        dx /= length;
        dy /= length;

        p.x += dx * p.speed;
        p.y += dy * p.speed;

        p.energy -= .015;
        p.hunger -= .008;
    }

    p.x = Math.max(30, Math.min(GAME_WIDTH - 30, p.x));
    p.y = Math.max(30, Math.min(GAME_HEIGHT - 30, p.y));

}


/* =========================================================
   NPCS
========================================================= */

function updateNPCs() {

    for (const npc of game.npcs) {

        npc.x += Math.cos(npc.direction) * npc.speed;
        npc.y += Math.sin(npc.direction) * npc.speed;

        if (
            npc.x < 30 ||
            npc.x > GAME_WIDTH - 30 ||
            npc.y < 30 ||
            npc.y > GAME_HEIGHT - 30
        ) {

            npc.direction += Math.PI;
        }

        if (Math.random() < .01) {

            npc.direction =
                Math.random() * Math.PI * 2;
        }
    }

}


/* =========================================================
   VEHÍCULOS
========================================================= */

function updateVehicles() {

    for (const vehicle of game.vehicles) {

        vehicle.x += vehicle.speed;

        if (vehicle.x > GAME_WIDTH + 100) {

            vehicle.x = -100;
        }
    }

}


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera() {

    game.camera.x =
        game.player.x -
        canvas.width / 2;

    game.camera.y =
        game.player.y -
        canvas.height / 2;

}


/* =========================================================
   DIBUJAR MAPA
========================================================= */

function drawWorld() {

    ctx.fillStyle = "#6fa35b";

    ctx.fillRect(
        0,
        0,
        GAME_WIDTH,
        GAME_HEIGHT
    );

    /* calles */

    ctx.fillStyle = "#444";

    ctx.fillRect(
        0,
        430,
        GAME_WIDTH,
        150
    );

    ctx.fillRect(
        760,
        0,
        160,
        GAME_HEIGHT
    );

    /* aceras */

    ctx.fillStyle = "#aaa";

    ctx.fillRect(
        0,
        430,
        GAME_WIDTH,
        12
    );

    ctx.fillRect(
        0,
        568,
        GAME_WIDTH,
        12
    );

    ctx.fillRect(
        760,
        0,
        12,
        GAME_HEIGHT
    );

    ctx.fillRect(
        908,
        0,
        12,
        GAME_HEIGHT
    );

}


/* =========================================================
   EDIFICIOS
========================================================= */

function drawBuildings() {

    for (const building of game.buildings) {

        ctx.fillStyle = building.color;

        ctx.fillRect(
            building.x,
            building.y,
            building.w,
            building.h
        );

        ctx.fillStyle = "#eee";

        ctx.fillRect(
            building.x + 20,
            building.y + 35,
            40,
            40
        );

        ctx.fillRect(
            building.x + building.w - 60,
            building.y + 35,
            40,
            40
        );

        ctx.fillStyle = "#222";

        ctx.fillRect(
            building.x + building.w / 2 - 20,
            building.y + building.h - 60,
            40,
            60
        );

        ctx.fillStyle = "#fff";

        ctx.font = "16px Arial";

        ctx.fillText(
            building.name,
            building.x + 15,
            building.y - 10
        );
    }

}


/* =========================================================
   VEHÍCULOS
========================================================= */

function drawVehicles() {

    for (const vehicle of game.vehicles) {

        ctx.fillStyle = vehicle.color;

        ctx.fillRect(
            vehicle.x,
            vehicle.y,
            80,
            35
        );

        ctx.fillStyle = "#111";

        ctx.fillRect(
            vehicle.x + 10,
            vehicle.y + 30,
            16,
            16
        );

        ctx.fillRect(
            vehicle.x + 55,
            vehicle.y + 30,
            16,
            16
        );

        ctx.fillStyle = "#111";

        ctx.fillRect(
            vehicle.x + 20,
            vehicle.y + 5,
            40,
            15
        );
    }

}


/* =========================================================
   NPC
========================================================= */

function drawNPCs() {

    for (const npc of game.npcs) {

        ctx.fillStyle = npc.color;

        ctx.beginPath();

        ctx.arc(
            npc.x,
            npc.y - 18,
            10,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#243b53";

        ctx.fillRect(
            npc.x - 9,
            npc.y - 8,
            18,
            28
        );

        ctx.fillStyle = "#fff";

        ctx.font = "11px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            npc.name,
            npc.x,
            npc.y - 32
        );

        ctx.textAlign = "left";
    }

}


/* =========================================================
   JUGADOR
========================================================= */

function drawPlayer() {

    const p = game.player;

    ctx.save();

    if (p.dancing) {

        const bounce =
            Math.sin(Date.now() / 100) * 5;

        ctx.translate(
            p.x,
            p.y + bounce
        );

    } else {

        ctx.translate(
            p.x,
            p.y
        );
    }

    /* cabeza */

    ctx.fillStyle = "#a66a45";

    ctx.beginPath();

    ctx.arc(
        0,
        -25,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* camisa */

    ctx.fillStyle = "#e63946";

    ctx.fillRect(
        -12,
        -13,
        24,
        30
    );

    /* pantalón */

    ctx.fillStyle = "#253237";

    ctx.fillRect(
        -11,
        17,
        9,
        18
    );

    ctx.fillRect(
        2,
        17,
        9,
        18
    );

    ctx.restore();

}


/* =========================================================
   INTERACCIÓN
========================================================= */

function getNearestBuilding() {

    const p = game.player;

    let nearest = null;
    let distance = Infinity;

    for (const building of game.buildings) {

        const cx =
            building.x +
            building.w / 2;

        const cy =
            building.y +
            building.h / 2;

        const d =
            Math.hypot(
                p.x - cx,
                p.y - cy
            );

        if (d < distance) {

            distance = d;
            nearest = building;
        }
    }

    return {
        building: nearest,
        distance
    };
}


function interact() {

    const result =
        getNearestBuilding();

    if (!result.building) return;

    if (result.distance > 180) {

        showNotification(
            "Acércate más para interactuar."
        );

        return;
    }

    const building =
        result.building;

    if (building.name.includes("Barbería")) {

        openInteraction(
            "💈 Barbería",
            "Puedes trabajar como barbero, cortarte el pelo o conversar con los vecinos."
        );

    }

    else if (building.name.includes("Supermercado")) {

        openInteraction(
            "🛒 Supermercado",
            "Aquí podrás trabajar como empacador, cajero o encargado."
        );

    }

    else if (building.name.includes("Escuela")) {

        openInteraction(
            "🎓 Escuela",
            "Puedes estudiar para mejorar tus habilidades."
        );

    }

    else if (building.name.includes("Club")) {

        openInteraction(
            "💃 Club Social",
            "Aquí podrás bailar bachata, merengue, salsa y compartir con tus amigos."
        );

    }

    else if (building.name.includes("Casa")) {

        openInteraction(
            "🏠 Casa Familiar",
            "Este es tu hogar. Aquí vivirás con tu familia."
        );

    }

    else {

        openInteraction(
            building.name,
            "Un lugar de la República Dominicana."
        );
    }

}


/* =========================================================
   TRABAJO
========================================================= */

function work() {

    const result =
        getNearestBuilding();

    if (
        !result.building ||
        result.distance > 180
    ) {

        showNotification(
            "Acércate a un lugar de trabajo."
        );

        return;
    }

    const name =
        result.building.name;

    if (name.includes("Barbería")) {

        game.player.job =
            "Barbero";

        game.player.money += 5;

        showNotification(
            "💈 Trabajaste como barbero. +$5"
        );

    }

    else if (name.includes("Supermercado")) {

        game.player.job =
            "Empacador";

        game.player.money += 4;

        showNotification(
            "🛒 Trabajaste como empacador. +$4"
        );

    }

    else {

        showNotification(
            "Aquí no puedes trabajar todavía."
        );
    }

}


/* =========================================================
   BAILE
========================================================= */

function toggleDance() {

    game.player.dancing =
        !game.player.dancing;

    if (game.player.dancing) {

        showNotification(
            "💃 ¡Estás bailando bachata!"
        );

        game.player.energy -= 5;

    } else {

        showNotification(
            "Terminaste de bailar."
        );
    }

}


/* =========================================================
   UI
========================================================= */

function updateUI() {

    const p = game.player;

    document.getElementById(
        "healthText"
    ).textContent =
        Math.round(p.health);

    document.getElementById(
        "energyText"
    ).textContent =
        Math.round(p.energy);

    document.getElementById(
        "hungerText"
    ).textContent =
        Math.round(p.hunger);

    document.getElementById(
        "healthBar"
    ).style.width =
        p.health + "%";

    document.getElementById(
        "energyBar"
    ).style.width =
        p.energy + "%";

    document.getElementById(
        "hungerBar"
    ).style.width =
        p.hunger + "%";

    document.getElementById(
        "money"
    ).textContent =
        "$" + p.money;

    document.getElementById(
        "job"
    ).textContent =
        p.job;

    document.getElementById(
        "year"
    ).textContent =
        game.year;

}


/* =========================================================
   NOTIFICACIONES
========================================================= */

let notificationTimer;

function showNotification(text) {

    const element =
        document.getElementById(
            "notification"
        );

    element.textContent = text;

    element.classList.add("show");

    clearTimeout(notificationTimer);

    notificationTimer =
        setTimeout(() => {

            element.classList.remove(
                "show"
            );

        }, 2500);
}


function openInteraction(title, text) {

    document.getElementById(
        "interactionTitle"
    ).textContent = title;

    document.getElementById(
        "interactionText"
    ).textContent = text;

    document.getElementById(
        "interaction"
    ).classList.add("active");
}


function closeInteraction() {

    document.getElementById(
        "interaction"
    ).classList.remove("active");
}


/* =========================================================
   CICLO DEL JUEGO
========================================================= */

function update() {

    updatePlayer();

    updateNPCs();

    updateVehicles();

    updateCamera();

    updateUI();

}


function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        -game.camera.x,
        -game.camera.y
    );

    drawWorld();

    drawBuildings();

    drawVehicles();

    drawNPCs();

    drawPlayer();

    ctx.restore();

}


function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   INICIO
========================================================= */

createBuildings();

createNPCs();

createVehicles();

showNotification(
    "🇩🇴 Bienvenido a Dominican City"
);

gameLoop();

</script>

</body>
</html>
