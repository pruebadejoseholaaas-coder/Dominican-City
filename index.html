<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dominican City 🇩🇴</title>


<style>

/* ==========================================================
   CONFIGURACIÓN GENERAL
========================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #101820;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;
}


body {

    user-select: none;

}


/* ==========================================================
   JUEGO
========================================================== */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:

        linear-gradient(
            #6fb2e3 0%,
            #a8d5f0 43%,
            #78a95b 44%,
            #5d914b 100%
        );
}


/* ==========================================================
   MUNDO
========================================================== */

#world {

    position: absolute;

    width: 6000px;
    height: 4000px;

    left: 0;
    top: 0;

    transform:
        translate(0px, 0px);

    transform-origin:
        top left;

}


/* ==========================================================
   REGIONES
========================================================== */

.region {

    position: absolute;

    border:
        2px solid
        rgba(0,0,0,0.12);

    border-radius: 12px;

}


.region-city {

    background:
        #7fa85b;

}


.region-rural {

    background:
        #6d9d58;

}


/* ==========================================================
   CARRETERAS
========================================================== */

.road {

    position: absolute;

    background:
        #555;

    border:
        3px solid
        #333;

}


.road::after {

    content: "";

    position: absolute;

    left: 0;
    top: 50%;

    width: 100%;
    height: 5px;

    transform:
        translateY(-50%);

    background:

        repeating-linear-gradient(
            90deg,

            #f6d365 0px,
            #f6d365 40px,

            transparent 40px,
            transparent 80px
        );

}


/* ==========================================================
   EDIFICIOS
========================================================== */

.location {

    position: absolute;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    color: white;

    font-weight: bold;

    font-size: 15px;

    border:
        3px solid
        rgba(0,0,0,0.35);

    border-radius: 8px;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.25);

    text-shadow:
        1px 1px 2px black;

}


.house {

    background:
        #c77b45;

}


.shop {

    background:
        #d39b35;

}


.barber {

    background:
        #4169a1;

}


.school {

    background:
        #d6c08d;

    color: #222;

    text-shadow: none;

}


.club {

    background:
        #753c7d;

}


.market {

    background:
        #ad573e;

}


.transport {

    background:
        #3c3c3c;

}


.sports {

    background:
        #427c3b;

}


.farm {

    background:
        #8a6b3d;

}


.beach {

    background:
        #29a9c9;

}


/* ==========================================================
   ÁRBOLES
========================================================== */

.tree {

    position: absolute;

    width: 32px;
    height: 32px;

    border-radius: 50%;

    background:
        #286b32;

    border:
        3px solid
        #17451f;

    box-shadow:
        0 8px 0
        #70452a;

}


/* ==========================================================
   NPC
========================================================== */

.npc {

    position: absolute;

    width: 34px;
    height: 48px;

    border-radius:
        50% 50% 35% 35%;

    border:
        3px solid
        rgba(0,0,0,0.45);

    box-shadow:
        0 3px 6px
        rgba(0,0,0,0.35);

    z-index: 20;

}


.npc::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 5px;
    top: -11px;

    border-radius: 50%;

    background:
        #8d5524;

    border:
        2px solid
        #4d2d16;

}


/* ==========================================================
   PERSONAJE PRINCIPAL
========================================================== */

#player {

    position: absolute;

    width: 46px;
    height: 64px;

    z-index: 100;

    border-radius:
        18px 18px 12px 12px;

    background:

        linear-gradient(
            90deg,

            #173f8a,
            #2458b8,
            #173f8a
        );

    border:
        3px solid #111;

    box-shadow:

        0 6px 12px
        rgba(0,0,0,0.45);

    transition:
        transform 0.12s ease;

}


/* CABEZA */

#player::before {

    content: "";

    position: absolute;

    width: 25px;
    height: 25px;

    left: 7px;
    top: -20px;

    border-radius: 50%;

    background:
        #8d5524;

    border:
        3px solid #3d2414;

    box-shadow:

        inset 0 3px 0
        #21150d;

}


/* CAMISA */

#player::after {

    content: "";

    position: absolute;

    left: 7px;
    top: 24px;

    width: 26px;
    height: 4px;

    background:
        #f4d35e;

    border-radius: 5px;

}


/* ==========================================================
   CAMINAR
========================================================== */

#player.walking {

    animation:
        playerWalk
        0.35s
        infinite
        alternate;

}


@keyframes playerWalk {

    from {

        transform:
            translateY(0px);

    }

    to {

        transform:
            translateY(-4px);

    }

}


/* ==========================================================
   BAILE
========================================================== */

#player.dancing {

    animation:
        playerDance
        0.55s
        infinite
        ease-in-out;

    background:

        linear-gradient(
            90deg,

            #e63946,
            #f7d046,
            #e63946
        );

    box-shadow:

        0 0 18px
        rgba(247,208,70,0.9);

}


@keyframes playerDance {

    0% {

        transform:
            rotate(-12deg)
            translateY(0);

    }

    25% {

        transform:
            rotate(12deg)
            translateY(-8px);

    }

    50% {

        transform:
            rotate(-12deg)
            translateY(-3px);

    }

    75% {

        transform:
            rotate(12deg)
            translateY(-10px);

    }

    100% {

        transform:
            rotate(-12deg)
            translateY(0);

    }

}


/* ==========================================================
   HUD
========================================================== */

#hud {

    position: fixed;

    left: 15px;
    top: 15px;

    z-index: 1000;

    width: 300px;

    padding: 16px;

    border-radius: 15px;

    background:
        rgba(10,15,20,0.90);

    border:
        2px solid
        rgba(255,255,255,0.22);

    box-shadow:

        0 8px 25px
        rgba(0,0,0,0.4);

    backdrop-filter:
        blur(5px);

}


#hud h1 {

    margin:
        0 0 8px 0;

    font-size: 22px;

    color:
        #f7d046;

}


.stat {

    margin:
        8px 0;

}


.bar {

    width: 100%;

    height: 9px;

    margin-top: 4px;

    overflow: hidden;

    border-radius: 20px;

    background:
        #333;

}


.bar-fill {

    height: 100%;

    width: 100%;

    transition:
        width 0.2s;

}


#healthFill {

    background:
        #e63946;

}


#energyFill {

    background:
        #f1c40f;

}


#hungerFill {

    background:
        #2ecc71;

}


#time {

    margin-top: 12px;

    padding-top: 10px;

    border-top:
        1px solid
        rgba(255,255,255,0.15);

    color:
        #f7d046;

}


/* ==========================================================
   MENSAJES
========================================================== */

#message {

    position: fixed;

    left: 50%;

    bottom: 110px;

    transform:
        translateX(-50%);

    z-index: 2000;

    max-width: 700px;

    min-width: 280px;

    padding:
        15px 25px;

    border-radius: 14px;

    background:
        rgba(0,0,0,0.90);

    border:
        2px solid
        rgba(255,255,255,0.25);

    font-size: 17px;

    font-weight: bold;

    text-align: center;

    opacity: 0;

    transition:
        opacity 0.25s;

    box-shadow:

        0 8px 20px
        rgba(0,0,0,0.45);

}


#message.visible {

    opacity: 1;

}


/* ==========================================================
   INDICADOR DE BAILE
========================================================== */

#danceIndicator {

    position: fixed;

    left: 50%;
    top: 22%;

    transform:
        translateX(-50%);

    z-index: 2500;

    padding:
        12px 25px;

    border-radius: 30px;

    background:

        linear-gradient(
            135deg,

            #e63946,
            #f7d046
        );

    color: white;

    font-size: 22px;

    font-weight: bold;

    text-shadow:
        2px 2px 3px
        rgba(0,0,0,0.5);

    box-shadow:

        0 5px 20px
        rgba(0,0,0,0.4);

    display: none;

    animation:

        danceIndicator
        0.6s
        infinite
        alternate;

}


#danceIndicator.visible {

    display: block;

}


@keyframes danceIndicator {

    from {

        transform:
            translateX(-50%)
            scale(1);

    }

    to {

        transform:
            translateX(-50%)
            scale(1.08);

    }

}


/* ==========================================================
   CONTROLES
========================================================== */

#controls {

    position: fixed;

    right: 15px;
    bottom: 15px;

    z-index: 1000;

    padding: 14px;

    width: 270px;

    border-radius: 13px;

    background:
        rgba(10,15,20,0.90);

    border:
        2px solid
        rgba(255,255,255,0.18);

    font-size: 13px;

    line-height: 1.8;

    box-shadow:

        0 6px 20px
        rgba(0,0,0,0.35);

}


#controls strong {

    color:
        #f7d046;

    font-size: 15px;

}


/* ==========================================================
   MINIMAPA
========================================================== */

#minimap {

    position: fixed;

    right: 15px;
    top: 15px;

    width: 190px;
    height: 125px;

    z-index: 1000;

    border:
        3px solid
        rgba(255,255,255,0.75);

    border-radius: 10px;

    background:
        #60934b;

    overflow: hidden;

    box-shadow:

        0 5px 15px
        rgba(0,0,0,0.4);

}


#miniPlayer {

    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        red;

    border:
        1px solid white;

    transform:
        translate(-50%, -50%);

}


/* ==========================================================
   PAUSA
========================================================== */

#paused {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 3000;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,0.72);

    font-size: 46px;

    font-weight: bold;

}


#paused.visible {

    display: flex;

}


/* ==========================================================
   MÓVILES
========================================================== */

@media (
    max-width: 700px
) {

    #hud {

        width: 230px;

        font-size: 12px;

    }


    #hud h1 {

        font-size: 17px;

    }


    #minimap {

        width: 140px;
        height: 90px;

    }


    #controls {

        width: 200px;

        font-size: 11px;

    }

}

</style>

</head>


<body>


<div id="game">


<!-- ======================================================
     MUNDO
====================================================== -->

<div id="world">

    <div id="regions"></div>

    <div id="roads"></div>

    <div id="locations"></div>

    <div id="trees"></div>

    <div id="npcs"></div>

    <div id="player"></div>

</div>


<!-- ======================================================
     HUD
====================================================== -->

<div id="hud">

    <h1>
        🇩🇴 Dominican City
    </h1>


    <div>

        👤
        <strong id="playerName">
            José
        </strong>

    </div>


    <div class="stat">

        💰 Dinero:
        $<span id="money">25</span>

    </div>


    <div class="stat">

        ❤️ Salud

        <div class="bar">

            <div
                id="healthFill"
                class="bar-fill">
            </div>

        </div>

    </div>


    <div class="stat">

        ⚡ Energía

        <div class="bar">

            <div
                id="energyFill"
                class="bar-fill">
            </div>

        </div>

    </div>


    <div class="stat">

        🍗 Hambre

        <div class="bar">

            <div
                id="hungerFill"
                class="bar-fill">
            </div>

        </div>

    </div>


    <div class="stat">

        💼 Trabajo:

        <span id="job">
            Desempleado
        </span>

    </div>


    <div id="time">

        🕐
        <span id="clock">
            08:00
        </span>

        &nbsp;|&nbsp;

        📅
        <span id="date">
            1/1/1965
        </span>

    </div>

</div>


<!-- ======================================================
     MINIMAPA
====================================================== -->

<div id="minimap">

    <div id="miniPlayer"></div>

</div>


<!-- ======================================================
     CONTROLES
====================================================== -->

<div id="controls">

    <strong>
        🎮 CONTROLES
    </strong>

    <br>

    ⬆️⬇️⬅️➡️ / WASD
    → Moverse

    <br>

    <strong>E</strong>
    → Interactuar

    <br>

    <strong>B</strong>
    → Bailar 💃

    <br>

    <strong>T</strong>
    → Trabajar 💼

    <br>

    <strong>F</strong>
    → Terminar trabajo

    <br>

    <strong>G</strong>
    → Guardar 💾

    <br>

    <strong>L</strong>
    → Cargar

    <br>

    <strong>P</strong>
    → Pausa

</div>


<!-- ======================================================
     MENSAJE
====================================================== -->

<div id="message"></div>


<!-- ======================================================
     INDICADOR DE BAILE
====================================================== -->

<div id="danceIndicator">

    💃 BAILANDO 💃

</div>


<!-- ======================================================
     PAUSA
====================================================== -->

<div id="paused">

    ⏸️ PAUSA

</div>


</div>


<!-- ======================================================
     MOTOR DEL JUEGO
====================================================== -->

<script type="module">


import {

    player

} from "./game/player.js";


import {

    WORLD,
    regions,
    roads,
    locations,
    trees

} from "./game/world.js";


import {

    npcs

} from "./game/npcs.js";


import {

    startGame,
    update,
    game

} from "./game/game.js";


/* ======================================================
   ELEMENTOS
====================================================== */

const world =
    document.getElementById(
        "world"
    );


const playerElement =
    document.getElementById(
        "player"
    );


const regionsElement =
    document.getElementById(
        "regions"
    );


const roadsElement =
    document.getElementById(
        "roads"
    );


const locationsElement =
    document.getElementById(
        "locations"
    );


const treesElement =
    document.getElementById(
        "trees"
    );


const npcsElement =
    document.getElementById(
        "npcs"
    );


const messageElement =
    document.getElementById(
        "message"
    );


const pausedElement =
    document.getElementById(
        "paused"
    );


/* ======================================================
   REGIONES
====================================================== */

function createRegions() {

    regionsElement.innerHTML = "";

    for (
        const region
        of regions
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            `region region-${region.type}`;


        element.style.left =
            region.x + "px";


        element.style.top =
            region.y + "px";


        element.style.width =
            region.width + "px";


        element.style.height =
            region.height + "px";


        regionsElement.appendChild(
            element
        );

    }

}


/* ======================================================
   CARRETERAS
====================================================== */

function createRoads() {

    roadsElement.innerHTML = "";


    for (
        const road
        of roads
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "road";


        element.style.left =
            road.x + "px";


        element.style.top =
            road.y + "px";


        element.style.width =
            road.width + "px";


        element.style.height =
            road.height + "px";


        roadsElement.appendChild(
            element
        );

    }

}


/* ======================================================
   LUGARES
====================================================== */

function createLocations() {

    locationsElement.innerHTML = "";


    for (
        const location
        of locations
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            `location ${location.type}`;


        element.textContent =
            location.name;


        element.style.left =
            location.x + "px";


        element.style.top =
            location.y + "px";


        element.style.width =
            location.width + "px";


        element.style.height =
            location.height + "px";


        locationsElement.appendChild(
            element
        );

    }

}


/* ======================================================
   ÁRBOLES
====================================================== */

function createTrees() {

    treesElement.innerHTML = "";


    for (
        const tree
        of trees
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "tree";


        element.style.left =
            tree.x + "px";


        element.style.top =
            tree.y + "px";


        element.style.transform =
            `scale(${tree.size / 32})`;


        treesElement.appendChild(
            element
        );

    }

}


/* ======================================================
   NPCS
====================================================== */

function createNPCs() {

    npcsElement.innerHTML = "";


    for (
        const npc
        of npcs
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "npc";


        element.title =
            `${npc.name} — ${npc.profession}`;


        element.style.background =
            npc.color;


        element.style.left =
            npc.x + "px";


        element.style.top =
            npc.y + "px";


        element.dataset.id =
            npc.id;


        npcsElement.appendChild(
            element
        );

    }

}


/* ======================================================
   ACTUALIZAR NPCS
====================================================== */

function updateNPCVisuals() {

    const elements =
        npcsElement.children;


    for (
        let i = 0;
        i < elements.length;
        i++
    ) {

        const element =
            elements[i];


        const npc =
            npcs[i];


        if (!npc) {

            continue;

        }


        element.style.left =
            npc.x + "px";


        element.style.top =
            npc.y + "px";

    }

}


/* ======================================================
   ACTUALIZAR JUGADOR
====================================================== */

function updatePlayerVisual() {

    playerElement.style.left =
        player.x + "px";


    playerElement.style.top =
        player.y + "px";


    /* Caminar */

    if (
        player.moving &&
        !player.dancing
    ) {

        playerElement.classList.add(
            "walking"
        );

    } else {

        playerElement.classList.remove(
            "walking"
        );

    }


    /* Bailar */

    if (
        player.dancing
    ) {

        playerElement.classList.add(
            "dancing"
        );

    } else {

        playerElement.classList.remove(
            "dancing"
        );

    }

}


/* ======================================================
   INDICADOR DE BAILE
====================================================== */

function updateDanceIndicator() {

    const indicator =
        document.getElementById(
            "danceIndicator"
        );


    if (
        player.dancing
    ) {

        indicator.classList.add(
            "visible"
        );

    } else {

        indicator.classList.remove(
            "visible"
        );

    }

}


/* ======================================================
   CÁMARA
====================================================== */

function updateCamera() {

    world.style.transform =
        `translate(
            ${-game.camera.x}px,
            ${-game.camera.y}px
        )`;

}


/* ======================================================
   HUD
====================================================== */

function updateHUD() {

    document.getElementById(
        "playerName"
    ).textContent =
        player.name;


    document.getElementById(
        "money"
    ).textContent =
        Math.floor(
            player.money
        );


    document.getElementById(
        "healthFill"
    ).style.width =
        `${player.health}%`;


    document.getElementById(
        "energyFill"
    ).style.width =
        `${player.energy}%`;


    document.getElementById(
        "hungerFill"
    ).style.width =
        `${player.hunger}%`;


    document.getElementById(
        "job"
    ).textContent =
        player.job;


    const hour =
        String(
            Math.floor(
                game.time.hour
            )
        ).padStart(
            2,
            "0"
        );


    const minute =
        String(
            Math.floor(
                game.time.minute
            )
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "clock"
    ).textContent =
        `${hour}:${minute}`;


    document.getElementById(
        "date"
    ).textContent =
        `${game.time.day}/${game.time.month}/${game.time.year}`;


    /* Mensajes */

    if (
        game.messageTimer > 0
    ) {

        messageElement.textContent =
            game.message;


        messageElement.classList.add(
            "visible"
        );

    } else {

        messageElement.classList.remove(
            "visible"
        );

    }


    /* Pausa */

    if (
        game.paused
    ) {

        pausedElement.classList.add(
            "visible"
        );

    } else {

        pausedElement.classList.remove(
            "visible"
        );

    }

}


/* ======================================================
   MINIMAPA
====================================================== */

function updateMinimap() {

    const miniPlayer =
        document.getElementById(
            "miniPlayer"
        );


    const x =
        player.x /
        WORLD.width *
        100;


    const y =
        player.y /
        WORLD.height *
        100;


    miniPlayer.style.left =
        `${x}%`;


    miniPlayer.style.top =
        `${y}%`;

}


/* ======================================================
   INICIALIZAR
====================================================== */

createRegions();

createRoads();

createLocations();

createTrees();

createNPCs();

startGame();


/* ======================================================
   LOOP DEL JUEGO
====================================================== */

let lastTime =
    performance.now();


function gameLoop(
    currentTime
) {

    const delta =
        Math.min(

            (
                currentTime -
                lastTime
            ) / 16.666,

            3

        );


    lastTime =
        currentTime;


    update(delta);


    updatePlayerVisual();


    updateDanceIndicator();


    updateNPCVisuals();


    updateCamera();


    updateHUD();


    updateMinimap();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


</script>


</body>

</html>
