<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dominican City 🇩🇴</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #101820;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;
        }


        /* ==================================================
           JUEGO
        ================================================== */

        #game {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background:
                linear-gradient(
                    #78b7e8 0%,
                    #a9d6f5 45%,
                    #76a85b 46%,
                    #60934b 100%
                );
        }


        /* ==================================================
           MUNDO
        ================================================== */

        #world {

            position: absolute;

            width: 6000px;
            height: 4000px;

            left: 0;
            top: 0;

            transform:
                translate(
                    0px,
                    0px
                );

            transform-origin:
                top left;
        }


        /* ==================================================
           TERRENO
        ================================================== */

        .region {

            position: absolute;

            border:
                2px solid
                rgba(0,0,0,0.12);

            border-radius: 10px;
        }


        .region-city {

            background:
                #7fa85b;
        }


        .region-rural {

            background:
                #6d9d58;
        }


        /* ==================================================
           CARRETERAS
        ================================================== */

        .road {

            position: absolute;

            background:
                #555;

            border:
                3px solid
                #333;
        }


        .road::after {

            content: "";

            position: absolute;

            left: 0;
            top: 50%;

            width: 100%;
            height: 5px;

            transform:
                translateY(-50%);

            background:
                repeating-linear-gradient(
                    90deg,
                    #f6d365 0px,
                    #f6d365 40px,
                    transparent 40px,
                    transparent 80px
                );
        }


        /* ==================================================
           EDIFICIOS
        ================================================== */

        .location {

            position: absolute;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            color: white;

            font-weight: bold;

            font-size: 15px;

            border:
                3px solid
                rgba(0,0,0,0.35);

            border-radius: 8px;

            box-shadow:
                0 5px 12px
                rgba(0,0,0,0.25);

            text-shadow:
                1px 1px 2px black;

            cursor: default;
        }


        .house {
            background: #c77b45;
        }

        .shop {
            background: #d39b35;
        }

        .barber {
            background: #4169a1;
        }

        .school {
            background: #d6c08d;
            color: #222;
            text-shadow: none;
        }

        .club {
            background: #753c7d;
        }

        .market {
            background: #ad573e;
        }

        .transport {
            background: #3c3c3c;
        }

        .sports {
            background: #427c3b;
        }

        .farm {
            background: #8a6b3d;
        }

        .beach {
            background: #29a9c9;
        }


        /* ==================================================
           ÁRBOLES
        ================================================== */

        .tree {

            position: absolute;

            width: 32px;
            height: 32px;

            border-radius: 50%;

            background:
                #286b32;

            border:
                3px solid
                #17451f;

            box-shadow:
                0 8px 0
                #70452a;
        }


        /* ==================================================
           NPC
        ================================================== */

        .npc {

            position: absolute;

            width: 34px;
            height: 48px;

            border-radius:
                50% 50% 35% 35%;

            border:
                3px solid
                rgba(0,0,0,0.45);

            box-shadow:
                0 3px 6px
                rgba(0,0,0,0.35);

            z-index: 20;
        }


        .npc::before {

            content: "";

            position: absolute;

            width: 18px;
            height: 18px;

            left: 5px;
            top: -11px;

            border-radius: 50%;

            background: #8d5524;

            border:
                2px solid
                #4d2d16;
        }


        /* ==================================================
           JUGADOR
        ================================================== */

        #player {

            position: absolute;

            width: 42px;
            height: 58px;

            z-index: 100;

            border:
                4px solid
                #111;

            border-radius:
                50% 50% 30% 30%;

            background:
                #d62828;

            box-shadow:
                0 5px 12px
                rgba(0,0,0,0.5);
        }


        #player::before {

            content: "";

            position: absolute;

            width: 23px;
            height: 23px;

            left: 5px;
            top: -15px;

            border-radius: 50%;

            background:
                #8d5524;

            border:
                3px solid
                #4d2d16;
        }


        /* ==================================================
           INTERFAZ
        ================================================== */

        #hud {

            position: fixed;

            left: 15px;
            top: 15px;

            z-index: 1000;

            width: 285px;

            padding: 15px;

            border-radius: 14px;

            background:
                rgba(10, 15, 20, 0.88);

            border:
                2px solid
                rgba(255,255,255,0.2);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.35);
        }


        #hud h1 {

            margin:
                0 0 8px 0;

            font-size: 21px;

            color:
                #f7d046;
        }


        .stat {

            margin:
                7px 0;
        }


        .bar {

            width: 100%;
            height: 9px;

            margin-top: 3px;

            overflow: hidden;

            border-radius: 20px;

            background:
                #333;
        }


        .bar-fill {

            height: 100%;

            width: 100%;

            transition:
                width 0.2s;
        }


        #healthFill {
            background: #e63946;
        }

        #energyFill {
            background: #f1c40f;
        }

        #hungerFill {
            background: #2ecc71;
        }


        #time {

            margin-top: 10px;

            padding-top: 10px;

            border-top:
                1px solid
                rgba(255,255,255,0.15);

            color:
                #f7d046;
        }


        /* ==================================================
           MENSAJE
        ================================================== */

        #message {

            position: fixed;

            left: 50%;

            bottom: 35px;

            transform:
                translateX(-50%);

            z-index: 2000;

            max-width: 700px;

            padding:
                14px 22px;

            border-radius: 12px;

            background:
                rgba(0,0,0,0.85);

            border:
                2px solid
                rgba(255,255,255,0.2);

            font-size: 16px;

            text-align: center;

            opacity: 0;

            transition:
                opacity 0.2s;
        }


        #message.visible {
            opacity: 1;
        }


        /* ==================================================
           CONTROLES
        ================================================== */

        #controls {

            position: fixed;

            right: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 13px;

            max-width: 260px;

            border-radius: 12px;

            background:
                rgba(10,15,20,0.85);

            font-size: 13px;

            line-height: 1.6;
        }


        #controls strong {

            color:
                #f7d046;
        }


        /* ==================================================
           MINIMAPA
        ================================================== */

        #minimap {

            position: fixed;

            right: 15px;
            top: 15px;

            width: 190px;
            height: 125px;

            z-index: 1000;

            border:
                3px solid
                rgba(255,255,255,0.7);

            border-radius: 10px;

            background:
                #60934b;

            overflow: hidden;
        }


        #miniPlayer {

            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                red;

            border:
                1px solid
                white;
        }


        /* ==================================================
           PAUSA
        ================================================== */

        #paused {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 3000;

            align-items: center;
            justify-content: center;

            background:
                rgba(0,0,0,0.7);

            font-size: 42px;

            font-weight: bold;
        }


        #paused.visible {

            display: flex;
        }

    </style>

</head>


<body>


<div id="game">


    <!-- ================================================
         MUNDO
    ================================================= -->

    <div id="world">

        <div id="regions"></div>

        <div id="roads"></div>

        <div id="locations"></div>

        <div id="trees"></div>

        <div id="npcs"></div>

        <div id="player"></div>

    </div>


    <!-- ================================================
         HUD
    ================================================= -->

    <div id="hud">

        <h1>
            🇩🇴 Dominican City
        </h1>

        <div>
            <strong id="playerName">
                José
            </strong>
        </div>

        <div class="stat">
            💰 Dinero:
            $<span id="money">25</span>
        </div>

        <div class="stat">

            ❤️ Salud

            <div class="bar">
                <div
                    id="healthFill"
                    class="bar-fill">
                </div>
            </div>

        </div>


        <div class="stat">

            ⚡ Energía

            <div class="bar">
                <div
                    id="energyFill"
                    class="bar-fill">
                </div>
            </div>

        </div>


        <div class="stat">

            🍗 Hambre

            <div class="bar">
                <div
                    id="hungerFill"
                    class="bar-fill">
                </div>
            </div>

        </div>


        <div class="stat">

            💼 Trabajo:
            <span id="job">
                Desempleado
            </span>

        </div>


        <div id="time">

            🕐
            <span id="clock">
                08:00
            </span>

            |

            📅
            <span id="date">
                1/1/1965
            </span>

        </div>

    </div>


    <!-- ================================================
         MINIMAPA
    ================================================= -->

    <div id="minimap">

        <div id="miniPlayer"></div>

    </div>


    <!-- ================================================
         CONTROLES
    ================================================= -->

    <div id="controls">

        <strong>CONTROLES</strong>

        <br>

        W A S D / Flechas
        → Moverse

        <br>

        E → Interactuar

        <br>

        B → Bailar 💃

        <br>

        G → Guardar 💾

        <br>

        L → Cargar

        <br>

        P → Pausa

    </div>


    <!-- ================================================
         MENSAJES
    ================================================= -->

    <div id="message"></div>


    <!-- ================================================
         PAUSA
    ================================================= -->

    <div id="paused">

        PAUSA

    </div>


</div>


<script type="module">

import {
    player
} from "./game/player.js";


import {
    WORLD,
    regions,
    roads,
    locations,
    trees
} from "./game/world.js";


import {
    npcs
} from "./game/npcs.js";


import {
    startGame,
    update,
    game
} from "./game/game.js";


/* ======================================================
   ELEMENTOS
====================================================== */

const world =
    document.getElementById(
        "world"
    );

const playerElement =
    document.getElementById(
        "player"
    );

const regionsElement =
    document.getElementById(
        "regions"
    );

const roadsElement =
    document.getElementById(
        "roads"
    );

const locationsElement =
    document.getElementById(
        "locations"
    );

const treesElement =
    document.getElementById(
        "trees"
    );

const npcsElement =
    document.getElementById(
        "npcs"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const pausedElement =
    document.getElementById(
        "paused"
    );


/* ======================================================
   CREAR REGIONES
====================================================== */

function createRegions() {

    regionsElement.innerHTML = "";

    for (
        const region
        of regions
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            `region region-${region.type}`;

        element.style.left =
            region.x + "px";

        element.style.top =
            region.y + "px";

        element.style.width =
            region.width + "px";

        element.style.height =
            region.height + "px";

        regionsElement.appendChild(
            element
        );
    }
}


/* ======================================================
   CREAR CARRETERAS
====================================================== */

function createRoads() {

    roadsElement.innerHTML = "";

    for (
        const road
        of roads
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "road";

        element.style.left =
            road.x + "px";

        element.style.top =
            road.y + "px";

        element.style.width =
            road.width + "px";

        element.style.height =
            road.height + "px";

        roadsElement.appendChild(
            element
        );
    }
}


/* ======================================================
   CREAR LUGARES
====================================================== */

function createLocations() {

    locationsElement.innerHTML = "";

    for (
        const location
        of locations
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            `location ${location.type}`;

        element.textContent =
            location.name;

        element.style.left =
            location.x + "px";

        element.style.top =
            location.y + "px";

        element.style.width =
            location.width + "px";

        element.style.height =
            location.height + "px";

        locationsElement.appendChild(
            element
        );
    }
}


/* ======================================================
   CREAR ÁRBOLES
====================================================== */

function createTrees() {

    treesElement.innerHTML = "";

    for (
        const tree
        of trees
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "tree";

        element.style.left =
            tree.x + "px";

        element.style.top =
            tree.y + "px";

        element.style.transform =
            `scale(${tree.size / 32})`;

        treesElement.appendChild(
            element
        );
    }
}


/* ======================================================
   CREAR NPCS
====================================================== */

function createNPCs() {

    npcsElement.innerHTML = "";

    for (
        const npc
        of npcs
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "npc";

        element.title =
            `${npc.name} — ${npc.profession}`;

        element.style.background =
            npc.color;

        element.style.left =
            npc.x + "px";

        element.style.top =
            npc.y + "px";

        element.dataset.id =
            npc.id;

        npcsElement.appendChild(
            element
        );
    }
}


/* ======================================================
   ACTUALIZAR NPCS VISUALES
====================================================== */

function updateNPCVisuals() {

    const elements =
        npcsElement.children;

    for (
        let i = 0;
        i < elements.length;
        i++
    ) {

        const element =
            elements[i];

        const npc =
            npcs[i];

        if (!npc) {
            continue;
        }

        element.style.left =
            npc.x + "px";

        element.style.top =
            npc.y + "px";
    }
}


/* ======================================================
   ACTUALIZAR JUGADOR
====================================================== */

function updatePlayerVisual() {

    playerElement.style.left =
        player.x + "px";

    playerElement.style.top =
        player.y + "px";
}


/* ======================================================
   ACTUALIZAR CÁMARA
====================================================== */

function updateCamera() {

    world.style.transform =
        `translate(
            ${-game.camera.x}px,
            ${-game.camera.y}px
        )`;
}


/* ======================================================
   ACTUALIZAR HUD
====================================================== */

function updateHUD() {

    document.getElementById(
        "playerName"
    ).textContent =
        player.name;


    document.getElementById(
        "money"
    ).textContent =
        Math.floor(
            player.money
        );


    document.getElementById(
        "healthFill"
    ).style.width =
        `${player.health}%`;


    document.getElementById(
        "energyFill"
    ).style.width =
        `${player.energy}%`;


    document.getElementById(
        "hungerFill"
    ).style.width =
        `${player.hunger}%`;


    document.getElementById(
        "job"
    ).textContent =
        player.job;


    const hour =
        String(
            Math.floor(
                game.time.hour
            )
        ).padStart(
            2,
            "0"
        );


    const minute =
        String(
            Math.floor(
                game.time.minute
            )
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "clock"
    ).textContent =
        `${hour}:${minute}`;


    document.getElementById(
        "date"
    ).textContent =
        `${game.time.day}/${game.time.month}/${game.time.year}`;


    /* Mensaje */

    if (
        game.messageTimer > 0
    ) {

        messageElement.textContent =
            game.message;

        messageElement.classList.add(
            "visible"
        );

    } else {

        messageElement.classList.remove(
            "visible"
        );
    }


    /* Pausa */

    if (
        game.paused
    ) {

        pausedElement.classList.add(
            "visible"
        );

    } else {

        pausedElement.classList.remove(
            "visible"
        );
    }
}


/* ======================================================
   MINIMAPA
====================================================== */

function updateMinimap() {

    const miniPlayer =
        document.getElementById(
            "miniPlayer"
        );


    const x =
        player.x /
        WORLD.width *
        100;


    const y =
        player.y /
        WORLD.height *
        100;


    miniPlayer.style.left =
        `${x}%`;

    miniPlayer.style.top =
        `${y}%`;
}


/* ======================================================
   INICIAR MUNDO
====================================================== */

createRegions();

createRoads();

createLocations();

createTrees();

createNPCs();

startGame();


/* ======================================================
   LOOP PRINCIPAL
====================================================== */

let lastTime =
    performance.now();


function gameLoop(
    currentTime
) {

    const delta =
        Math.min(
            (currentTime - lastTime) /
            16.666,
            3
        );

    lastTime =
        currentTime;


    update(delta);

    updatePlayerVisual();

    updateNPCVisuals();

    updateCamera();

    updateHUD();

    updateMinimap();


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);

</script>

</body>

</html>
